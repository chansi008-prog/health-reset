name: 저녁 8시 알림
on:
  # 매일 저녁 8시 실행은 cron-job.org가 이 workflow를 깨운다 (GitHub 자체 예약은 몇 시간씩 늦어서 쓰지 않음)
  workflow_dispatch:
    inputs:
      only_name:
        description: "시험: 이 이름에게만 보내기 (비우면 미완료자 전체)"
        required: false
jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --no-package-lock firebase-admin@12
      - run: node scripts/remind.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ONLY_NAME: ${{ inputs.only_name }}
