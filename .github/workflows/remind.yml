name: 저녁 8시 알림
on:
  # 한국 저녁 8시 = 11:00 UTC. GitHub 무료 예약은 정각에 자주 건너뛰므로 정각을 피해 세 번 건다.
  # 스크립트가 하루 한 번만 보내고 나머지는 건너뛴다 (meta/remindSent).
  schedule:
    - cron: "2 11 * * *"
    - cron: "17 11 * * *"
    - cron: "40 11 * * *"
  workflow_dispatch:
    inputs:
      only_name:
        description: "시험: 이 이름에게만 보내기 (비우면 미완료자 전체)"
        required: false
jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --no-package-lock firebase-admin@12
      - run: node scripts/remind.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ONLY_NAME: ${{ inputs.only_name }}
